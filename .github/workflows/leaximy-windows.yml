# Builds Leaximy for Windows and its installer, Leaximy-<version>-Setup.exe,
# on every push to main (and when started by hand from the Actions tab).
# The installer is published on the repository's Releases page under the
# tag leaximy-v<version>, so friends download one file and click through.
name: Leaximy Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Build without releasing; the installer waits as a draft and no installed copy updates to it
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leaximy-windows
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Rust
        shell: pwsh
        run: rustup toolchain install

      # MilkDrop's libprojectM reads OpenGL through GLEW.
      - name: GLEW for MilkDrop
        run: vcpkg install glew:x64-windows-static

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: cargo build --release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      #
      # The in-app updater (src/updates.rs) reads the release tagged
      # v<version> and needs leaximy-v<version>-x86_64-pc-windows-msvc-setup.exe
      # with its SHA-256 in checksums.txt. Leaximy-<version>-Setup.exe is the
      # same file under the name people download.
      - name: Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" /DArch=x86_64 `
            "/DBinary=$PWD\target\release\leaximy.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\leaximy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\Leaximy-$version-Setup.exe" "dist\leaximy-v$version-x86_64-pc-windows-msvc-setup.exe"
          Copy-Item target\release\leaximy.exe "dist\Leaximy-$version-portable.exe"
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD\dist\checksums.txt", ($lines -join "`n") + "`n")
          Get-Content dist\checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Leaximy-Windows
          path: dist/*
          if-no-files-found: error

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Leaximy ${{ steps.version.outputs.version }}
          # A draft is not offered to installed copies; publishing it (or
          # running this again without draft) releases it.
          draft: ${{ inputs.draft == true }}
          make_latest: ${{ inputs.draft == true && 'false' || 'true' }}
          files: dist/*
          body: |
            **Kurulum:** `Leaximy-${{ steps.version.outputs.version }}-Setup.exe` dosyasını indir, çift tıkla, "İleri"ye bas.
            Yönetici izni gerekmez. Windows "bilinmeyen yayımcı" uyarısı verirse **Ek bilgi → Yine de çalıştır**.

            Kurulumdan sonra Leaximy kendini güncel tutar: yeni sürüm çıkınca kendisi indirir, "yeniden başlat" demen yeterli.

            **Kurulumsuz:** `Leaximy-${{ steps.version.outputs.version }}-portable.exe` doğrudan çalışır (kendini güncellemez).

            Diğer dosyalar Leaximy'nin otomatik güncellemesi içindir, indirmene gerek yok.

            Müzik çalmak için Spotify Premium gerekir.
